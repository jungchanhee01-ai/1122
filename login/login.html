<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURE GLS - 관리자 로그인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }
        input:focus {
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <!-- 로고 및 타이틀 영역 -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-block text-2xl font-extrabold text-slate-900 tracking-tight">
                FUTURE <span class="text-orange-600">GLS</span>
            </a>
            <p class="text-slate-500 text-sm mt-2">관리자 전용 로그인 페이지입니다.</p>
        </div>

        <!-- 로그인 성공/실패 안내 메시지 박스 -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-xs sm:text-sm font-semibold transition-all"></div>

        <!-- 로그인 폼 -->
        <form id="loginForm" class="space-y-6" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">관리자 아이디</label>
                <input type="text" id="adminId" required 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition text-slate-800 placeholder-slate-400"
                    placeholder="아이디를 입력하세요">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">비밀번호</label>
                <input type="password" id="adminPassword" required 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition text-slate-800 placeholder-slate-400"
                    placeholder="비밀번호를 입력하세요">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-slate-600 cursor-pointer">
                    <input type="checkbox" class="rounded border-slate-300 text-orange-600 focus:ring-orange-500 mr-2">
                    로그인 상태 유지
                </label>
                <a href="#" class="text-orange-600 hover:underline font-medium">비밀번호 찾기</a>
            </div>

            <button type="submit" 
                class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">
                로그인
            </button>
        </form>

        <!-- 홈으로 돌아가기 -->
        <div class="text-center mt-6">
            <a href="../index.html" class="text-sm text-slate-500 hover:text-slate-800 transition">
                &larr; 메인 화면으로 돌아가기
            </a>
        </div>
    </div>

    <script>
        function showMessage(text, isSuccess) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = text;
            alertBox.classList.remove('hidden');
            if (isSuccess) {
                alertBox.className = "mb-6 p-4 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-2";
            } else {
                alertBox.className = "mb-6 p-4 rounded-xl text-xs sm:text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-2";
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('adminId').value;
            const pw = document.getElementById('adminPassword').value;

            // 설정하신 관리자 계정 (아이디: FUTURE001, 비밀번호: FUTURE001)
            if (id === 'FUTURE001' && pw === 'FUTURE001') {
                showMessage('관리자 로그인 성공! 환영합니다.', true);
                localStorage.setItem('isAdminLoggedIn', 'true'); // 로그인 상태 유지 키 설정
                localStorage.setItem('adminName', '관리자');
                
                // 로그인 성공 후 메인 화면으로 이동
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 800);
            } else {
                showMessage('아이디 또는 비밀번호가 일치하지 않습니다.', false);
            }
        }
    </script>
</body>
</html>
