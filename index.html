<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURE GLS - Global Logistics & Freight Forwarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .dynamic-nav { font-size: 1rem; gap: 2rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased selection:bg-orange-600 selection:text-white">

    <!-- Top Bar -->
    <div class="bg-slate-900 text-slate-300 py-2 text-xs">
        <div class="max-w-7xl mx-auto px-4 flex justify-between">
            <span>Welcome to Future GLS</span>
            <div class="flex gap-4">
                <a href="#">Login</a>
                <a href="#">Register</a>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-orange-600">FUTURE GLS</h1>
            <div class="dynamic-nav flex font-bold text-slate-700">
                <a href="#services" class="hover:text-orange-600">Services</a>
                <a href="board.html" class="hover:text-orange-600">Board</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="py-20 text-center">
        <h2 class="text-5xl font-black mb-4">Global Logistics Solution</h2>
        <p class="text-slate-500">Fast, Safe, and Reliable.</p>
    </section>

    <!-- Services Section & Interactive Dynamic Board -->
    <section id="services" class="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 bg-white rounded-3xl my-12 border border-slate-200/80 shadow-sm">
        
        <!-- 게시판 섹션 (요청사항 반영) -->
        <div class="grid md:grid-cols-2 gap-8">
            <!-- 업계소식 (왼쪽) -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-3xl p-6 sm:p-10">
                <div class="flex items-center justify-between mb-6 border-b border-slate-200 pb-4">
                    <h3 class="text-lg font-black text-slate-900">업계소식</h3>
                    <a href="board.html" class="text-sm font-bold text-slate-600 hover:text-orange-600 transition-colors">More</a>
                </div>
                <div id="newsContainer" class="divide-y divide-slate-200 min-h-[150px]"></div>
            </div>

            <!-- 공지사항 (오른쪽) -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-3xl p-6 sm:p-10">
                <div class="flex items-center justify-between mb-6 border-b border-slate-200 pb-4">
                    <h3 class="text-lg font-black text-slate-900">공지사항</h3>
                    <a href="board.html" class="text-sm font-bold text-slate-600 hover:text-orange-600 transition-colors">More</a>
                </div>
                <div id="noticeContainer" class="divide-y divide-slate-200 min-h-[150px]"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12 text-center text-sm">
        <p>&copy; 2026 FUTURE GLS. All rights reserved.</p>
    </footer>

    <!-- Firebase 및 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            /* 기존 설정값 유지 */
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchBoardData() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(10));
            const querySnapshot = await getDocs(q);
            
            const newsList = [];
            const noticeList = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.category === '업계소식') newsList.push(data);
                if (data.category === '공지사항') noticeList.push(data);
            });

            renderPosts('newsContainer', newsList.slice(0, 5));
            renderPosts('noticeContainer', noticeList.slice(0, 5));
        }

        function renderPosts(containerId, posts) {
            const container = document.getElementById(containerId);
            container.innerHTML = posts.length > 0 ? '' : '<p class="text-sm text-slate-400 py-4">게시글이 없습니다.</p>';
            posts.forEach(post => {
                container.innerHTML += `
                    <a href="board.html" class="block py-3 text-sm text-slate-700 hover:text-orange-600 truncate">
                        ${post.title}
                    </a>
                `;
            });
        }

        fetchBoardData();
    </script>
</body>
</html>
