<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry News</title>
  <style>
    /* 기존 스타일 유지 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f8fafc;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
    }

    .lang-dropdown-wrapper {
      position: relative;
      display: inline-block;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #f0f4f9;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      background-color: #e2e8f0;
    }

    .lang-btn svg {
      width: 16px;
      height: 16px;
      fill: #475569;
    }

    .lang-btn .arrow {
      width: 12px;
      height: 12px;
      transition: transform 0.2s ease;
    }

    .lang-dropdown-wrapper.active .arrow {
      transform: rotate(180deg);
    }

    .lang-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background-color: #ffffff; 쿠키
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 6px 0;
      min-width: 120px;
      z-index: 1000;
    }

    .lang-dropdown-wrapper.active .lang-menu {
      display: block;
    }

    .lang-option {
      display: block;
      width: 100%;
      padding: 8px 16px;
      text-align: left;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .lang-option:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* Google Translate 숨김 처리 */
    #google_translate_element {
      display: none !important;
    }
    .goog-te-banner-frame {
      display: none !important;
    }
    body {
      top: 0px !important;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h2 class="title">Industry News</h2>

    <div class="lang-dropdown-wrapper" id="langDropdownWrapper">
      <button class="lang-btn" id="langBtn" onclick="toggleLangMenu(event)">
        <!-- 지구본 아이콘 -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <span id="currentLangText">KOR</span>
        <!-- 화살표 아이콘 -->
        <svg class="arrow" viewBox="0 0 24 24">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </button>

      <div class="lang-menu" id="langMenu">
        <button class="lang-option" onclick="selectLanguage('ko', 'KOR')">KOR</button>
        <button class="lang-option" onclick="selectLanguage('en', 'ENGLISH')">ENGLISH</button>
      </div>
    </div>
  </div>

  <!-- Google Translate 요소를 위한 숨김 디브 -->
  <div id="google_translate_element"></div>

  <!-- Google Translate 스크립트 -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ko',
        includedLanguages: 'ko,en',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    // 언어 메뉴 드롭다운 토글
    function toggleLangMenu(event) {
      event.stopPropagation();
      const wrapper = document.getElementById('langDropdownWrapper');
      wrapper.classList.toggle('active');
    }

    // 외부 클릭 시 메뉴 닫기
    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('langDropdownWrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        wrapper.classList.remove('active');
      }
    });

    // 구글 번역 쿠키 설정 함수 (번역 상태를 완벽하게 유지하기 위함)
    function setCookie(name, val, days) {
      let expires = "";
      if (days) {
        let date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (val || "") + expires + "; path=/";
    }

    // 언어 선택 함수
    function selectLanguage(langCode, langText) {
      // 1. UI 텍스트 즉시 변경
      const currentLangSpan = document.getElementById('currentLangText');
      if (currentLangSpan) {
        currentLangSpan.innerText = langText;
      }

      // 드롭다운 닫기
      const wrapper = document.getElementById('langDropdownWrapper');
      if (wrapper) {
        wrapper.classList.remove('active');
      }

      // 2. 구글 번역 쿠키 설정 (ko 혹은 en/ko)
      if (langCode === 'en') {
        setCookie('googtrans', '/ko/en', 1);
      } else {
        setCookie('googtrans', '/ko/ko', 1);
      }

      // 3. 페이지 새로고침을 통해 구글 번역 엔진이 쿠키를 읽어 완벽하게 번역 상태를 유지하도록 적용
      window.location.reload();
    }

    // 페이지 로드 시 쿠키를 검사하여 현재 언어 표기 및 번역 상태 동기화
    window.addEventListener('DOMContentLoaded', function() {
      const cookie = document.cookie;
      const currentLangSpan = document.getElementById('currentLangText');
      
      if (cookie.includes('googtrans=/ko/en')) {
        if (currentLangSpan) {
          currentLangSpan.innerText = 'ENGLISH';
        }
      } else {
        if (currentLangSpan) {
          currentLangSpan.innerText = 'KOR';
        }
      }
    });
  </script>
</body>
</html>
