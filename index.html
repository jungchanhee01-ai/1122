<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Homepage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Remixicon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Header, Hero, Services 섹션 등 상단 코드는 그대로 유지한다고 가정 -->

    <!-- [수정된] Services Section & Interactive Dynamic Board -->
    <section id="services" class="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 bg-white rounded-3xl my-12 border border-slate-200/80 shadow-sm">
        <div class="text-center max-w-2xl mx-auto mb-16">
            <span class="text-xs font-bold text-orange-600 uppercase tracking-widest block mb-2" data-i18n="svc_sub">OUR CORE SERVICES & NEWS</span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900" data-i18n="svc_title">해상부터 항공까지 통합 물류 솔루션</h2>
            <p class="text-slate-500 text-sm mt-3" data-i18n="svc_desc">수출입 고객의 특성에 맞춘 최적의 물류 경로와 투명한 정산 체계를 지원합니다.</p>
        </div>

        <!-- 기존 서비스 카드 영역 (생략, 기존 코드 그대로 사용) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            <!-- 서비스 카드들... -->
        </div>

        <!-- [수정됨] 공지사항 & 업계소식 좌우 분리 배치 -->
        <div class="grid md:grid-cols-2 gap-8">
            <!-- 왼쪽: 업계소식 -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-3xl p-6 sm:p-8">
                <div class="flex items-center justify-between mb-6 border-b border-slate-200 pb-4">
                    <h3 class="text-lg font-black text-slate-900" data-i18n="tab_news">업계소식</h3>
                    <a href="board.html" class="text-sm font-bold text-slate-500 hover:text-orange-600 transition-colors flex items-center gap-1">More <i class="ri-arrow-right-s-line"></i></a>
                </div>
                <div id="newsContainer" class="divide-y divide-slate-200 min-h-[200px]">
                    <!-- 자바스크립트로 데이터 주입 -->
                </div>
            </div>

            <!-- 오른쪽: 공지사항 -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-3xl p-6 sm:p-8">
                <div class="flex items-center justify-between mb-6 border-b border-slate-200 pb-4">
                    <h3 class="text-lg font-black text-slate-900" data-i18n="tab_notice">공지사항</h3>
                    <a href="board.html" class="text-sm font-bold text-slate-500 hover:text-orange-600 transition-colors flex items-center gap-1">More <i class="ri-arrow-right-s-line"></i></a>
                </div>
                <div id="noticeContainer" class="divide-y divide-slate-200 min-h-[200px]">
                    <!-- 자바스크립트로 데이터 주입 -->
                </div>
            </div>
        </div>
    </section>

    <!-- Script 영역 -->
    <script>
        // 데이터 샘플 (실제 연동 시 데이터 구조에 맞게 수정)
        const industryNews = [
            { title: "글로벌 해상 운임 동향 분석", date: "2026.08.09" },
            { title: "항공 물류 자동화 도입 사례", date: "2026.08.08" }
        ];
        const notices = [
            { title: "하계 휴가 기간 운영 안내", date: "2026.08.01" },
            { title: "시스템 점검 공지", date: "2026.07.25" }
        ];

        // 렌더링 함수 수정
        window.renderBoardList = function() {
            const newsContainer = document.getElementById('newsContainer');
            const noticeContainer = document.getElementById('noticeContainer');

            const renderItems = (items) => items.map(item => `
                <a href="board.html" class="py-4 flex items-center justify-between hover:text-orange-600 transition-colors group">
                    <span class="text-sm font-medium truncate pr-4">${item.title}</span>
                    <span class="text-xs text-slate-400 shrink-0">${item.date}</span>
                </a>
            `).join('');

            newsContainer.innerHTML = industryNews.length > 0 ? renderItems(industryNews) : '<div class="py-10 text-center text-sm text-slate-400">등록된 소식이 없습니다.</div>';
            noticeContainer.innerHTML = notices.length > 0 ? renderItems(notices) : '<div class="py-10 text-center text-sm text-slate-400">등록된 공지사항이 없습니다.</div>';
        }

        // 페이지 로드 시 호출
        document.addEventListener('DOMContentLoaded', renderBoardList);
    </script>
</body>
</html>
