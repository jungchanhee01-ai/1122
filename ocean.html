<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Freight - FUTURE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Remixicon CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xl font-black tracking-tighter text-slate-900">FUTURE</a>
                <span class="text-xs px-2 py-1 bg-blue-100 text-blue-700 font-bold rounded-md">OCEAN</span>
            </div>
            
            <!-- Auth Buttons & Navigation -->
            <div id="authButtons" class="flex items-center gap-2.5 shrink-0">
                <!-- 언어 선택 버튼 -->
                <div class="relative">
                    <button type="button" onclick="toggleLangMenu(event)" id="currentLangBtn" class="inline-flex items-center gap-1.5 text-xs font-bold px-4 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 hover:bg-slate-200 transition-all">
                        <i class="ri-global-line"></i> <span id="langBtnText">KOR</span> <i class="ri-arrow-down-s-line"></i>
                    </button>
                    <div id="langDropdown" class="hidden absolute right-0 mt-2 w-32 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50 text-xs font-bold text-slate-700">
                        <a href="javascript:void(0);" onclick="changeLanguage('ko', 'KOR')" class="block px-4 py-2 hover:bg-slate-50 hover:text-orange-600">한국어</a>
                        <a href="javascript:void(0);" onclick="changeLanguage('en', 'ENG')" class="block px-4 py-2 hover:bg-slate-50 hover:text-orange-600">English</a>
                        <a href="javascript:void(0);" onclick="changeLanguage('zh-CN', 'CHN')" class="block px-4 py-2 hover:bg-slate-50 hover:text-orange-600">中文</a>
                        <a href="javascript:void(0);" onclick="changeLanguage('ja', 'JPN')" class="block px-4 py-2 hover:bg-slate-50 hover:text-orange-600">日本語</a>
                    </div>
                </div>
                
                <a href="index.html#tracking" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 hover:bg-slate-200 transition-all whitespace-nowrap">
                    <i class="ri-search-line"></i> <span data-i18n="btn_tracking">화물 추적</span>
                </a>
                <a href="index.html#quote" class="inline-flex items-center gap-1.5 text-xs font-bold px-4 py-2.5 rounded-xl bg-orange-600 text-white hover:bg-orange-700 transition-all shadow-md shadow-orange-600/20 whitespace-nowrap">
                    <span data-i18n="btn_quote">견적 요청</span> <i class="ri-arrow-right-line"></i>
                </a>

                <!-- 관리자 로그인 상태에 따라 동적으로 변경될 영역 -->
                <div id="adminAuthContainer" class="relative">
                    <!-- 로그아웃 상태일 때 -->
                    <a id="adminLoginBtn" href="login/login.html" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold px-3.5 py-2.5 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-all shadow-md whitespace-nowrap">
                        <i class="ri-user-settings-line"></i> <span data-i18n="btn_admin">관리자</span>
                    </a>

                    <!-- 로그인 상태일 때 드롭다운 메뉴 -->
                    <div id="adminUserMenu" class="hidden relative sm:inline-block">
                        <button type="button" onclick="toggleAdminMenu(event)" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-slate-800 bg-white px-3.5 py-2.5 rounded-xl border border-slate-200 shadow-sm shrink-0 cursor-pointer">
                            <i class="ri-user-star-line text-orange-600"></i> 관리자(FUTURE) <i class="ri-arrow-down-s-line"></i>
                        </button>
                        <div id="adminDropdown" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50 text-xs font-bold text-slate-700">
                            <a href="javascript:void(0);" onclick="handleLogout()" class="block px-4 py-2 hover:bg-slate-50 hover:text-orange-600 flex items-center gap-2">
                                <i class="ri-logout-box-line"></i> 로그아웃
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-6">Ocean Freight Service</h1>
        <p class="text-slate-600">해상 화물 운송 서비스 안내 페이지입니다[cite: 8].</p>
    </main>

    <!-- JavaScript -->
    <script>
        const originalTextCache = new Map();

        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isAdminLoggedIn');
            const adminLoginBtn = document.getElementById('adminLoginBtn');
            const adminUserMenu = document.getElementById('adminUserMenu');

            if (isLoggedIn === 'true') {
                if (adminLoginBtn) adminLoginBtn.style.display = 'none';
                if (adminUserMenu) adminUserMenu.classList.remove('hidden');
            } else {
                if (adminLoginBtn) adminLoginBtn.style.display = 'inline-flex';
                if (adminUserMenu) adminUserMenu.classList.add('hidden');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => originalTextCache.set(el, el.innerHTML));
        });

        function toggleLangMenu(e) {
            e.stopPropagation();
            document.getElementById('langDropdown').classList.toggle('hidden');
        }

        function toggleAdminMenu(e) { 
            e.stopPropagation(); 
            document.getElementById('adminDropdown').classList.toggle('hidden'); 
        }

        function handleLogout() {
            localStorage.removeItem('isAdminLoggedIn');
            alert('로그아웃 되었습니다.');
            location.reload();
        }

        window.addEventListener('click', () => {
            const langDropdown = document.getElementById('langDropdown');
            if (langDropdown) langDropdown.classList.add('hidden');
            
            const adminDropdown = document.getElementById('adminDropdown');
            if (adminDropdown) adminDropdown.classList.add('hidden');
        });
    </script>
</body>
</html>
