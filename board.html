    <!-- Firebase SDK 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPwNp7-Yrl6LwAqaReC3ht1JKwSnTTEcI",
            authDomain: "jch01-65141.firebaseapp.com",
            projectId: "jch01-65141",
            storageBucket: "jch01-65141.firebasestorage.app",
            messagingSenderId: "885424801252",
            appId: "1:885424801252:web:0b840323f160d0d4cc73f1",
            measurementId: "G-3ECML2H6S6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let posts = [];
        let currentPostId = null;
        let currentTab = 'all';
        const editor = document.getElementById('postContentEditor');
        let savedRange = null;

        async function fetchPosts() {
            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                posts = [];
                querySnapshot.forEach((docSnap) => {
                    posts.push({ docId: docSnap.id, ...docSnap.data() });
                });
                filterTab(currentTab);
            } catch (error) {
                console.error("데이터 로딩 실패:", error);
                document.getElementById('boardBody').innerHTML = `<tr><td colspan="6" class="py-8 text-rose-500">데이터를 불러오지 못했습니다. Firestore 설정을 확인해주세요.</td></tr>`;
            }
        }

        window.toggleDropdown = function() {
            document.getElementById('dropdownMenu').classList.toggle('hidden');
            document.getElementById('dropdownIcon').classList.toggle('rotate-180');
        }

        window.selectCategory = function(category) {
            document.getElementById('postCategory').value = category;
            document.getElementById('selectedCategoryText').innerText = category;
            toggleDropdown();
        }

        window.saveSelection = function() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) {
                    savedRange = range;
                }
            }
        }

        window.applyFontSize = function(selectElem) {
            const size = selectElem.value;
            if (!size) return;
            editor.focus();
            const selection = window.getSelection();
            if (savedRange) { selection.removeAllRanges(); selection.addRange(savedRange); }
            
            const span = document.createElement('span');
            span.style.fontSize = size;
            span.appendChild(selection.getRangeAt(0).extractContents());
            selection.getRangeAt(0).insertNode(span);
            selectElem.value = "";
        }

        window.insertImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                editor.focus();
                if (savedRange) {
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(savedRange);
                }
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.maxWidth = "100%";
                img.style.borderRadius = "0.75rem";
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    selection.getRangeAt(0).insertNode(img);
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        window.filterTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabAll').className = tab === 'all' ? "px-4 py-2 rounded-xl text-sm font-bold bg-orange-600 text-white shadow-sm" : "px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200";
            document.getElementById('tabNotice').className = tab === '공지사항' ? "px-4 py-2 rounded-xl text-sm font-bold bg-orange-600 text-white shadow-sm" : "px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200";
            document.getElementById('tabNews').className = tab === '업계소식' ? "px-4 py-2 rounded-xl text-sm font-bold bg-orange-600 text-white shadow-sm" : "px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200";

            document.getElementById('searchInput').value = '';

            const target = tab === 'all' ? posts : posts.filter(p => p.category === tab);
            renderTable(target);
        }

        function renderTable(data) {
            const tbody = document.getElementById('boardBody');
            tbody.innerHTML = '';
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-slate-400">등록된 게시글이 없습니다.</td></tr>`;
                return;
            }

            data.forEach((post, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors cursor-pointer";
                tr.onclick = () => viewDetail(post.docId);
                
                const badge = post.category === '공지사항' 
                    ? `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-600">공지사항</span>`
                    : `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600">업계소식</span>`;

                tr.innerHTML = `
                    <td class="py-4 px-4 text-slate-400 font-medium">${data.length - index}</td>
                    <td class="py-4 px-4">${badge}</td>
                    <td class="py-4 px-6 text-left font-semibold text-slate-900">${post.title}</td>
                    <td class="py-4 px-4">${post.writer}</td>
                    <td class="py-4 px-4 text-xs text-slate-500">${post.date}</td>
                    <td class="py-4 px-4 text-xs text-slate-400">${post.views || 0}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.searchBoard = function() {
            const searchType = document.getElementById('searchType').value;
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!keyword) {
                alert('검색어를 입력해주세요.');
                filterTab(currentTab);
                return;
            }

            const baseData = currentTab === 'all' ? posts : posts.filter(p => p.category === currentTab);

            const filteredData = baseData.filter(post => {
                if (searchType === 'title') {
                    return post.title && post.title.toLowerCase().includes(keyword);
                } else if (searchType === 'writer') {
                    return post.writer && post.writer.toLowerCase().includes(keyword);
                }
                return false;
            });

            renderTable(filteredData);
        };

        document.getElementById('searchInput').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                searchBoard();
            }
        });

        window.viewDetail = async function(docId) {
            const docRef = doc(db, "posts", docId);
            const docSnap = await getDoc(docRef);
            if(!docSnap.exists()) return;

            const post = docSnap.data();
            currentPostId = docId;

            const newViews = (post.views || 0) + 1;
            await updateDoc(docRef, { views: newViews });

            document.getElementById('detailCategory').innerText = post.category;
            document.getElementById('detailTitle').innerText = post.title;
            document.getElementById('detailWriter').innerText = post.writer;
            document.getElementById('detailDate').innerText = post.date;
            document.getElementById('detailViews').innerText = newViews;
            document.getElementById('detailContent').innerHTML = post.content;

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('pageHeader').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.showListView = function() {
            currentPostId = null;
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('pageHeader').style.display = 'flex';
            fetchPosts();
        }

        window.deletePost = async function() {
            if(confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                await deleteDoc(doc(db, "posts", currentPostId));
                alert('게시글이 삭제되었습니다.');
                showListView();
            }
        }

        window.openWriteModal = function() { document.getElementById('writeModal').classList.remove('hidden'); }
        window.closeWriteModal = function() { 
            document.getElementById('writeModal').classList.add('hidden');
            document.getElementById('writeForm').reset();
            editor.innerHTML = '';
        }

        window.submitPost = async function(event) {
            event.preventDefault();
            const category = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value;
            const writer = document.getElementById('postWriter').value;
            const content = editor.innerHTML;

            if (!content.trim() || content === '<br>') { alert('내용을 입력해주세요.'); return; }

            const today = new Date().toISOString().split('T')[0];

            try {
                await addDoc(collection(db, "posts"), {
                    category,
                    title,
                    writer,
                    date: today,
                    views: 0,
                    content,
                    createdAt: Date.now()
                });
                alert('성공적으로 등록되었습니다.');
                closeWriteModal();
                fetchPosts();
            } catch (error) {
                console.error("등록 실패:", error);
                alert('등록 중 오류가 발생했습니다.');
            }
        }

        // 페이지 로드 시 로그인 상태 확인 및 UI 반영 (글쓰기, 삭제 버튼 제어)
        window.addEventListener('DOMContentLoaded', () => {
            fetchPosts();

            const isLoggedIn = localStorage.getItem('isAdminLoggedIn');
            const adminBtn = document.getElementById('adminBtn');
            const authButtons = document.getElementById('authButtons');
            const writeBtn = document.getElementById('writeBtn');
            const deleteButtonContainer = document.getElementById('deleteButtonContainer');

            if (isLoggedIn === 'true') {
                if (writeBtn) {
                    writeBtn.classList.remove('hidden');
                }
                if (deleteButtonContainer) {
                    deleteButtonContainer.classList.remove('hidden'); // 관리자 로그인 시 삭제 버튼 노출
                }

                if (adminBtn && authButtons) {
                    adminBtn.remove();

                    const nameSpan = document.createElement('span');
                    nameSpan.className = "inline-flex items-center gap-1 text-xs font-bold text-slate-800 bg-slate-100 px-3 py-2.5 rounded-xl border border-slate-200 shadow-sm shrink-0";
                    nameSpan.innerHTML = `<i class="ri-user-star-line text-orange-600"></i> 관리자(FUTURE)`;
                    authButtons.appendChild(nameSpan);

                    const logoutBtn = document.createElement('button');
                    logoutBtn.innerHTML = `로그아웃 <i class="ri-logout-box-r-line"></i>`;
                    logoutBtn.className = "inline-flex items-center gap-1 text-xs font-bold px-3 py-2.5 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-all shadow-md shrink-0";
                    logoutBtn.onclick = () => {
                        localStorage.removeItem('isAdminLoggedIn');
                        localStorage.removeItem('adminName');
                        window.location.reload();
                    };
                    authButtons.appendChild(logoutBtn);
                }
            } else {
                if (writeBtn) {
                    writeBtn.classList.add('hidden');
                }
                if (deleteButtonContainer) {
                    deleteButtonContainer.classList.add('hidden'); // 비로그인 시 삭제 버튼 숨김
                }
            }
        });
    </script>
</body>
</html>
