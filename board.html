<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURE GLS - 업계소식</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        body { font-family: 'Pretendard', sans-serif; scroll-behavior: smooth; }
        .editor-content img, #detailContent img { 
            max-width: 100% !important; 
            height: auto !important; 
            border-radius: 0.75rem; 
            margin: 1rem 0; 
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- 상단 네비게이션 -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 relative flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black text-slate-900 tracking-wider z-10">FUTURE <span class="text-orange-600">GLS</span></a>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600 absolute left-1/2 -translate-x-1/2">
                <a href="ceo.html" class="hover:text-orange-600 transition-colors">회사소개</a>
                <a href="ocean.html" class="hover:text-orange-600 transition-colors">해상운송</a>
                <a href="air.html" class="hover:text-orange-600 transition-colors">항공운송</a>
                <a href="triangle.html" class="hover:text-orange-600 transition-colors">삼국간운송</a>
                <a href="customs.html" class="hover:text-orange-600 transition-colors">통관업무</a>
                <a href="board.html" class="text-orange-600 transition-colors">업계소식</a>
            </nav>

            <div class="z-10 w-20"></div>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="py-16 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-1">
        
        <!-- 페이지 타이틀 헤더 -->
        <div id="pageHeader" class="mb-14 border-b border-slate-200 pb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 mb-4">
                    <a href="index.html" class="hover:text-orange-600">홈</a>
                    <i class="ri-arrow-right-s-line"></i>
                    <span class="text-orange-600 font-bold">업계소식</span>
                </div>
                
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-2 h-2 rounded-full bg-orange-600"></span>
                    <span class="text-xs font-bold text-orange-600 uppercase tracking-widest">C U S T O M E R &nbsp; C E N T E R</span>
                </div>
                <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 leading-snug tracking-tight">
                    물류 산업의 최신 <span class="text-orange-600">소식 및 공지</span>를 전해드립니다.
                </h1>
            </div>
            
            <!-- 글쓰기 버튼 -->
            <button onclick="openWriteModal()" class="bg-slate-900 hover:bg-orange-600 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2 shrink-0">
                <i class="ri-pencil-line"></i> 글쓰기
            </button>
        </div>

        <!-- [뷰 1] 목록 화면 -->
        <div id="listView">
            <!-- 탭 메뉴 (전체 / 공지사항 / 업계소식) -->
            <div class="flex gap-2 mb-6">
                <button onclick="filterTab('all')" id="tabAll" class="px-4 py-2 rounded-xl text-sm font-bold bg-orange-600 text-white shadow-sm transition-all">전체</button>
                <button onclick="filterTab('공지사항')" id="tabNotice" class="px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all">공지사항</button>
                <button onclick="filterTab('업계소식')" id="tabNews" class="px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all">업계소식</button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-8">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-700 font-bold text-center">
                                <th class="py-4 px-4 w-16">번호</th>
                                <th class="py-4 px-4 w-32">구분</th>
                                <th class="py-4 px-6 text-left">제목</th>
                                <th class="py-4 px-4 w-24">작성자</th>
                                <th class="py-4 px-4 w-28">작성일자</th>
                                <th class="py-4 px-4 w-20">조회</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-center text-slate-600" id="boardBody">
                            <!-- 동적 렌더링 -->
                        </tbody>
                    </table>
                </div>

                <!-- 페이지네이션 -->
                <div class="py-6 bg-slate-50 border-t border-slate-200 flex justify-center items-center gap-1.5 text-sm font-semibold">
                    <button class="w-8 h-8 rounded-lg bg-orange-600 text-white flex items-center justify-center shadow-sm">1</button>
                </div>
            </div>

            <!-- 검색 영역 -->
            <div class="flex justify-center items-center gap-2">
                <select id="searchType" class="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-700 outline-none focus:border-orange-600 shadow-sm">
                    <option value="title">제목</option>
                    <option value="writer">작성자</option>
                </select>
                <div class="relative w-full max-w-sm">
                    <input type="text" id="searchInput" placeholder="검색어를 입력하세요" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-orange-600 shadow-sm">
                </div>
                <button onclick="searchBoard()" class="bg-orange-600 hover:bg-orange-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-md transition-all shrink-0">
                    검색
                </button>
            </div>
        </div>

        <!-- [뷰 2] 상세 보기 화면 (기본 숨김) -->
        <div id="detailView" class="hidden">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-8">
                <table class="w-full text-left border-collapse text-sm sm:text-base border-b border-slate-200">
                    <tbody class="divide-y divide-slate-200">
                        <tr>
                            <th class="py-4 px-6 bg-slate-50 font-bold text-slate-700 w-28 sm:w-36 text-center border-r border-slate-200">구분</th>
                            <td id="detailCategory" class="py-4 px-6 font-bold text-orange-600"></td>
                        </tr>
                        <tr>
                            <th class="py-4 px-6 bg-slate-50 font-bold text-slate-700 text-center border-r border-slate-200">제목</th>
                            <td id="detailTitle" class="py-4 px-6 font-bold text-slate-900"></td>
                        </tr>
                        <tr>
                            <th class="py-4 px-6 bg-slate-50 font-bold text-slate-700 text-center border-r border-slate-200">작성자</th>
                            <td id="detailWriter" class="py-4 px-6 text-slate-700"></td>
                        </tr>
                        <tr>
                            <th class="py-4 px-6 bg-slate-50 font-bold text-slate-700 text-center border-r border-slate-200">작성일자</th>
                            <td id="detailDate" class="py-4 px-6 text-slate-600"></td>
                        </tr>
                        <tr>
                            <th class="py-4 px-6 bg-slate-50 font-bold text-slate-700 text-center border-r border-slate-200">조회</th>
                            <td id="detailViews" class="py-4 px-6 text-slate-600"></td>
                        </tr>
                    </tbody>
                </table>

                <div class="p-8 sm:p-12 min-h-[250px]">
                    <div id="detailContent" class="text-slate-800 leading-relaxed text-base sm:text-lg"></div>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <button onclick="deletePost()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-md transition-all flex items-center gap-2">
                    <i class="ri-delete-bin-line"></i> 삭제하기
                </button>
                <button onclick="showListView()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-md transition-all flex items-center gap-2">
                    <i class="ri-list-unordered"></i> 목록으로
                </button>
            </div>
        </div>

    </main>

    <!-- 글쓰기 모달 팝업 -->
    <div id="writeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-orange-600"></span> 게시글 작성
                </h3>
                <button onclick="closeWriteModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">
                    <i class="ri-close-line"></i>
                </button>
            </div>

            <form id="writeForm" onsubmit="submitPost(event)" class="space-y-4">
                <!-- 커스텀 드롭다운 카테고리 선택 -->
                <div class="relative">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">카테고리 선택</label>
                    <input type="hidden" id="postCategory" value="공지사항">
                    <div onclick="toggleDropdown()" id="dropdownToggle" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-semibold text-slate-800 flex justify-between items-center cursor-pointer focus:border-orange-600">
                        <span id="selectedCategoryText">공지사항</span>
                        <i id="dropdownIcon" class="ri-arrow-down-s-line text-slate-400 transition-transform"></i>
                    </div>
                    <div id="dropdownMenu" class="hidden absolute top-full left-0 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden z-20">
                        <div onclick="selectCategory('공지사항')" class="px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-orange-50 hover:text-orange-600 cursor-pointer transition-colors">공지사항</div>
                        <div onclick="selectCategory('업계소식')" class="px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-orange-50 hover:text-orange-600 cursor-pointer transition-colors">업계소식</div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">제목</label>
                    <input type="text" id="postTitle" required placeholder="제목을 입력하세요" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 outline-none focus:border-orange-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">작성자</label>
                    <input type="text" id="postWriter" value="관리자" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 outline-none focus:border-orange-600">
                </div>
                <div>
                    <div class="flex flex-wrap justify-between items-center mb-1 gap-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase">내용 (서식 및 이미지 첨부 가능)</label>
                        <!-- 에디터 툴바 -->
                        <div class="flex flex-wrap items-center gap-2 text-xs">
                            <select id="fontSizeSelect" onmousedown="saveSelection()" onchange="applyFontSize(this)" class="bg-slate-100 border border-slate-300 rounded-lg px-2 py-1 outline-none font-semibold text-slate-700">
                                <option value="">글자 크기 선택</option>
                                <option value="12px">12 px (작게)</option>
                                <option value="14px">14 px (보통)</option>
                                <option value="16px">16 px (기본)</option>
                                <option value="20px">20 px (크게)</option>
                                <option value="24px">24 px (매우 크게)</option>
                                <option value="28px">28 px (특대)</option>
                                <option value="32px">32 px (최대)</option>
                            </select>
                            <select id="fontFamilySelect" onmousedown="saveSelection()" onchange="applyFontFamily(this)" class="bg-slate-100 border border-slate-300 rounded-lg px-2 py-1 outline-none font-semibold text-slate-700">
                                <option value="">기본 글꼴</option>
                                <option value="Pretendard, sans-serif">프리텐다드</option>
                                <option value="Gulim, 굴림, sans-serif">굴림</option>
                                <option value="Dotum, 돋움, sans-serif">돋움</option>
                                <option value="Batang, 바탕, serif">바탕</option>
                                <option value="Courier New, monospace">고정폭</option>
                            </select>
                            <label class="bg-orange-50 hover:bg-orange-100 text-orange-600 border border-orange-200 px-3 py-1 rounded-lg cursor-pointer font-bold transition-colors flex items-center gap-1">
                                <i class="ri-image-add-line"></i> 사진 첨부
                                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="insertImage(event)">
                            </label>
                        </div>
                    </div>
                    <!-- 리치 텍스트 편집 영역 -->
                    <div id="postContentEditor" contenteditable="true" onmouseup="saveSelection()" onkeyup="saveSelection()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-4 text-base text-slate-800 outline-none focus:border-orange-600 min-h-[220px] max-h-[350px] overflow-y-auto"></div>
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeWriteModal()" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-bold text-sm hover:bg-slate-100 transition-colors">취소</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-bold text-sm shadow-md transition-all">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-slate-200 py-12 text-center text-xs text-slate-500 mt-20">
        <div class="max-w-7xl mx-auto px-4">
            <p class="font-bold text-slate-800 text-sm mb-2">FUTURE GLS (주)퓨처지엘스</p>
            <p>&copy; FUTURE GLS. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- 스크립트 -->
    <script>
        let posts = JSON.parse(localStorage.getItem('futureGlsPosts'));
        if (!posts) {
            posts = [];
            localStorage.setItem('futureGlsPosts', JSON.stringify(posts));
        }

        let currentPostId = null;
        let currentTab = 'all';
        const editor = document.getElementById('postContentEditor');
        let savedRange = null;

        // 커스텀 드롭다운 제어 함수
        function toggleDropdown() {
            const menu = document.getElementById('dropdownMenu');
            const icon = document.getElementById('dropdownIcon');
            menu.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        function selectCategory(category) {
            document.getElementById('postCategory').value = category;
            document.getElementById('selectedCategoryText').innerText = category;
            toggleDropdown();
        }

        // 화면 바깥 클릭 시 드롭다운 닫기
        window.addEventListener('click', function(e) {
            const toggle = document.getElementById('dropdownToggle');
            const menu = document.getElementById('dropdownMenu');
            const icon = document.getElementById('dropdownIcon');
            if (!toggle.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        });

        function saveSelection() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) {
                    savedRange = range;
                }
            }
        }

        function applyStyle(styleProperty, styleValue) {
            editor.focus();
            const selection = window.getSelection();
            
            if (savedRange) {
                selection.removeAllRanges();
                selection.addRange(savedRange);
            }

            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);

            if (range.collapsed) {
                const span = document.createElement('span');
                span.style[styleProperty] = styleValue;
                span.innerHTML = '&#8203;';
                range.insertNode(span);
                
                const newRange = document.createRange();
                newRange.setStart(span.firstChild, 1);
                newRange.collapse(true);
                selection.removeAllRanges();
                selection.addRange(newRange);
            } else {
                const span = document.createElement('span');
                span.style[styleProperty] = styleValue;
                span.appendChild(range.extractContents());
                range.insertNode(span);
                
                selection.removeAllRanges();
                const newRange = document.createRange();
                newRange.selectNodeContents(span);
                selection.addRange(newRange);
            }
            saveSelection(); 
        }

        function applyFontSize(selectElem) {
            const size = selectElem.value;
            if (!size) return;
            applyStyle('fontSize', size);
            selectElem.value = ""; 
        }

        function applyFontFamily(selectElem) {
            const font = selectElem.value;
            if (!font) return;
            applyStyle('fontFamily', font);
            selectElem.value = "";
        }

        function insertImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                editor.focus();
                
                if (savedRange) {
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(savedRange);
                }

                const img = document.createElement('img');
                img.src = base64Image;
                img.style.maxWidth = "100%";
                img.style.borderRadius = "0.75rem";
                img.style.margin = "1rem 0";
                
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.insertNode(img);
                    range.collapse(false);
                } else {
                    editor.appendChild(img);
                }
                saveSelection();
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function filterTab(tab) {
            currentTab = tab;
            
            document.getElementById('tabAll').className = tab === 'all' ? "px-4 py-2 rounded-xl text-sm font-bold bg-orange-600 text-white shadow-sm transition-all" : "px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all";
            document.getElementById('tabNotice').className = tab === '공지사항' ? "px-4 py-2 rounded-xl text-sm font-bold bg-orange-600 text-white shadow-sm transition-all" : "px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all";
            document.getElementById('tabNews').className = tab === '업계소식' ? "px-4 py-2 rounded-xl text-sm font-bold bg-orange-600 text-white shadow-sm transition-all" : "px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all";

            if(tab === 'all') {
                renderTable(posts);
            } else {
                const filtered = posts.filter(p => p.category === tab);
                renderTable(filtered);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('boardBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-slate-400">등록된 게시글이 없습니다.</td></tr>`;
                return;
            }

            data.forEach(post => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors cursor-pointer";
                tr.onclick = () => viewDetail(post.id);
                
                const categoryBadge = post.category === '공지사항' 
                    ? `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-600">공지사항</span>`
                    : `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600">업계소식</span>`;

                tr.innerHTML = `
                    <td class="py-4 px-4 text-slate-400 font-medium">${post.id}</td>
                    <td class="py-4 px-4">${categoryBadge}</td>
                    <td class="py-4 px-6 text-left font-semibold text-slate-900 hover:text-orange-600">${post.title}</td>
                    <td class="py-4 px-4">${post.writer}</td>
                    <td class="py-4 px-4 text-xs text-slate-500">${post.date}</td>
                    <td class="py-4 px-4 text-xs text-slate-400">${post.views}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function viewDetail(id) {
            const post = posts.find(p => p.id === id);
            if(!post) return;

            currentPostId = id;
            post.views += 1;
            localStorage.setItem('futureGlsPosts', JSON.stringify(posts));

            document.getElementById('detailCategory').innerText = post.category || '업계소식';
            document.getElementById('detailTitle').innerText = post.title;
            document.getElementById('detailWriter').innerText = post.writer;
            document.getElementById('detailDate').innerText = post.date;
            document.getElementById('detailViews').innerText = post.views;
            document.getElementById('detailContent').innerHTML = post.content;

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('pageHeader').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showListView() {
            currentPostId = null;
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('pageHeader').style.display = 'flex';
            filterTab(currentTab);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deletePost() {
            if(confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                posts = posts.filter(p => p.id !== currentPostId);
                localStorage.setItem('futureGlsPosts', JSON.stringify(posts));
                alert('게시글이 삭제되었습니다.');
                showListView();
            }
        }

        function searchBoard() {
            const type = document.getElementById('searchType').value;
            const keyword = document.getElementById('searchInput').value.toLowerCase();

            let targetList = currentTab === 'all' ? posts : posts.filter(p => p.category === currentTab);

            const filtered = targetList.filter(post => {
                if(type === 'title') {
                    return post.title.toLowerCase().includes(keyword);
                } else if(type === 'writer') {
                    return post.writer.toLowerCase().includes(keyword);
                }
            });
            renderTable(filtered);
        }

        function openWriteModal() {
            document.getElementById('writeModal').classList.remove('hidden');
        }
        function closeWriteModal() {
            document.getElementById('writeModal').classList.add('hidden');
            document.getElementById('writeForm').reset();
            selectCategory('공지사항'); // 모달 닫힐 때 기본값으로 초기화
            editor.innerHTML = '';
            savedRange = null;
            document.getElementById('fontSizeSelect').value = "";
            document.getElementById('fontFamilySelect').value = "";
        }

        function submitPost(event) {
            event.preventDefault();
            const category = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value;
            const writer = document.getElementById('postWriter').value;
            const content = editor.innerHTML;
            
            if (!content.trim() || content === '<br>') {
                alert('내용을 입력해주세요.');
                return;
            }

            const today = new Date().toISOString().split('T')[0];

            const newPost = {
                id: posts.length > 0 ? posts[0].id + 1 : 1,
                category: category,
                title: title,
                writer: writer,
                date: today,
                views: 1,
                content: content
            };

            posts.unshift(newPost);
            localStorage.setItem('futureGlsPosts', JSON.stringify(posts));
            filterTab(currentTab);
            closeWriteModal();
            alert('성공적으로 등록되었습니다.');
        }

        filterTab('all');
    </script>
</body>
</html>
