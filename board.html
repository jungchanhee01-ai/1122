<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURE GLS - 업계소식</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        body { font-family: 'Pretendard', sans-serif; scroll-behavior: smooth; }
        .goog-te-banner-frame, .skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .dynamic-nav { font-size: 1.05rem; gap: 2.75rem; }
        html[lang*="en"] .dynamic-nav { font-size: 0.75rem; gap: 0.75rem; }

        /* 번역 완료 전 깜빡임 방지를 위한 초기 투명도 설정 */
        body { opacity: 0; transition: opacity 0.3s ease-in-out; }
        body.translated { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased selection:bg-orange-600 selection:text-white">

    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-6">
            <a href="index.html" class="flex items-center gap-2.5 shrink-0 notranslate">
                <div class="w-10 h-10 rounded-xl bg-orange-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-orange-600/20">
                    <i class="ri-ship-line"></i>
                </div>
                <div>
                    <span class="text-lg font-black tracking-wider block leading-none text-slate-900">FUTURE GLS</span>
                    <span class="text-[10px] tracking-widest text-orange-600 font-semibold uppercase mt-0.5 block">Global Logistics</span>
                </div>
            </a>
            
            <nav class="hidden lg:flex items-center font-bold text-slate-600 dynamic-nav transition-all">
                <a href="ceo.html" class="hover:text-orange-600 transition-colors whitespace-nowrap">회사소개</a>
                <a href="air.html" class="hover:text-orange-600 transition-colors whitespace-nowrap">항공운송</a>
                <a href="ocean.html" class="hover:text-orange-600 transition-colors whitespace-nowrap">해상운송</a>
                <a href="triangle.html" class="hover:text-orange-600 transition-colors whitespace-nowrap">삼국간운송</a>
                <a href="customs.html" class="hover:text-orange-600 transition-colors whitespace-nowrap">통관업무</a>
                <a href="board.html" class="text-orange-600 transition-colors whitespace-nowrap">업계소식</a>
            </nav>

            <div class="flex items-center gap-2.5 shrink-0" id="authButtons">
                <a href="index.html#tracking" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 hover:bg-slate-200 transition-all whitespace-nowrap">
                    <i class="ri-search-line"></i> 화물추적
                </a>
                <a href="index.html#quote" class="inline-flex items-center gap-1.5 text-xs font-bold px-4 py-2.5 rounded-xl bg-orange-600 text-white hover:bg-orange-700 transition-all shadow-md shadow-orange-600/20 whitespace-nowrap">
                    견적요청 <i class="ri-arrow-right-line"></i>
                </a>
                <a href="login/login.html" id="adminBtn" class="inline-flex items-center gap-1.5 text-xs font-bold px-3.5 py-2.5 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-all shadow-md whitespace-nowrap">
                    <i class="ri-user-settings-line"></i> 관리자
                </a>
            </div>  
        </div>
    </header>

    <main class="py-16 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-1">
        <div class="mb-14 border-b border-slate-200 pb-8">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 mb-4">
                <a href="index.html" class="hover:text-orange-600">홈</a>
                <i class="ri-arrow-right-s-line"></i>
                <span class="text-orange-600 font-bold">업계소식</span>
            </div>
            <div class="flex items-center gap-2 mb-3">
                <span class="w-2 h-2 rounded-full bg-orange-600"></span>
                <span class="text-xs font-bold text-orange-600 uppercase tracking-widest">N E W S &nbsp; & &nbsp; N O T I C E</span>
            </div>
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 leading-snug tracking-tight">
                    퓨처지엘스의 소식과 <span class="text-orange-600">최신 물류 트렌드</span>
                </h1>
                <!-- 관리자 전용 글쓰기 버튼 (초기 비공개) -->
                <div id="writeBtnContainer"></div>
            </div>
        </div>

        <div class="bg-white p-8 sm:p-12 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            <!-- 검색창 영역 복구 -->
            <div class="flex flex-col sm:flex-row gap-3 justify-between items-center pb-6 border-b border-slate-100">
                <div class="text-sm font-bold text-slate-700">
                    전체 소식 <span class="text-orange-600" id="totalCount">2</span>건
                </div>
                <div class="flex w-full sm:w-auto gap-2">
                    <div class="relative flex-1 sm:w-72">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="ri-search-line"></i>
                        </span>
                        <input type="text" id="searchInput" placeholder="검색어를 입력하세요" class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-orange-500 transition-colors">
                    </div>
                    <button onclick="handleSearch()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition-all shrink-0">검색</button>
                </div>
            </div>

            <!-- 게시글 목록 -->
            <div class="divide-y divide-slate-100" id="boardList">
                <div class="py-4 flex justify-between items-center board-item">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-md">공지</span>
                        <a href="#" class="font-semibold text-slate-800 hover:text-orange-600 text-sm sm:text-base">2026년 글로벌 물류 운송 스케줄 변동 안내</a>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-xs text-slate-400">2026.06.01</span>
                        <!-- 관리자 전용 삭제 버튼 영역 -->
                        <div class="admin-delete-container"></div>
                    </div>
                </div>
                <div class="py-4 flex justify-between items-center board-item">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md">뉴스</span>
                        <a href="#" class="font-semibold text-slate-800 hover:text-orange-600 text-sm sm:text-base">미주 및 유럽 항로 해상 운임 동향 리포트</a>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-xs text-slate-400">2026.05.20</span>
                        <!-- 관리자 전용 삭제 버튼 영역 -->
                        <div class="admin-delete-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-12 text-center text-xs text-slate-500 mt-20">
        <div class="max-w-7xl mx-auto px-4">
            <p class="font-bold text-slate-800 text-sm mb-2">FUTURE GLS (주)퓨처지엘스</p>
            <p>&copy; FUTURE GLS. All Rights Reserved.</p>
        </div>
    </footer>

    <div id="google_translate_element" style="display:none;"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isAdminLoggedIn');
            const adminBtn = document.getElementById('adminBtn');
            const authButtons = document.getElementById('authButtons');

            if (isLoggedIn === 'true' && adminBtn && authButtons) {
                adminBtn.remove();
                const nameSpan = document.createElement('span');
                nameSpan.className = "inline-flex items-center gap-1 text-xs font-bold text-slate-800 bg-slate-100 px-3.5 py-2.5 rounded-xl border border-slate-200 shadow-sm shrink-0 whitespace-nowrap";
                nameSpan.innerHTML = `<i class="ri-user-star-line text-orange-600"></i> 관리자`;
                authButtons.appendChild(nameSpan);
                
                const logoutBtn = document.createElement('button');
                logoutBtn.innerHTML = `로그아웃`;
                logoutBtn.className = "inline-flex items-center gap-1 text-xs font-bold px-3.5 py-2.5 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-all shadow-md shrink-0 whitespace-nowrap";
                logoutBtn.onclick = () => {
                    localStorage.removeItem('isAdminLoggedIn');
                    localStorage.removeItem('adminName');
                    window.location.reload();
                };
                authButtons.appendChild(logoutBtn);

                // 관리자 로그인 시 글쓰기 버튼 생성
                const writeContainer = document.getElementById('writeBtnContainer');
                if (writeContainer) {
                    writeContainer.innerHTML = `
                        <a href="board_write.html" class="inline-flex items-center gap-1.5 text-xs font-bold px-4 py-2.5 rounded-xl bg-orange-600 text-white hover:bg-orange-700 transition-all shadow-md shadow-orange-600/20 whitespace-nowrap">
                            <i class="ri-pencil-line"></i> 글작성
                        </a>
                    `;
                }

                // 관리자 로그인 시 각 게시글에 삭제 버튼 생성
                const deleteContainers = document.querySelectorAll('.admin-delete-container');
                deleteContainers.forEach((container, idx) => {
                    container.innerHTML = `
                        <button onclick="deletePost(this)" class="text-xs text-red-500 hover:text-red-700 font-semibold px-2 py-1 bg-red-50 rounded border border-red-100 transition-colors">
                            삭제
                        </button>
                    `;
                });
            }

            if (authButtons) {
                const langContainer = document.createElement('div');
                langContainer.className = "relative inline-block text-left notranslate";
                langContainer.innerHTML = `
                    <button type="button" onclick="toggleLangMenu(event)" class="inline-flex items-center gap-1.5 text-xs font-bold px-3.5 py-2.5 rounded-xl bg-slate-800 text-white hover:bg-slate-700 transition-all shadow-md whitespace-nowrap">
                        <i class="ri-global-line text-orange-400"></i> Lang <i class="ri-arrow-down-s-line"></i>
                    </button>
                    <div id="langDropdown" class="hidden absolute right-0 mt-2 w-32 bg-slate-900 rounded-xl shadow-xl border border-slate-700 py-1.5 z-50 text-xs font-medium text-slate-200">
                        <a href="javascript:void(0);" onclick="changeLanguage('ko')" class="block px-4 py-2 hover:bg-slate-800 hover:text-orange-400 transition-colors">한국어</a>
                        <a href="javascript:void(0);" onclick="changeLanguage('en')" class="block px-4 py-2 hover:bg-slate-800 hover:text-orange-400 transition-colors">English</a>
                        <a href="javascript:void(0);" onclick="changeLanguage('zh-CN')" class="block px-4 py-2 hover:bg-slate-800 hover:text-orange-400 transition-colors">中文</a>
                        <a href="javascript:void(0);" onclick="changeLanguage('ja')" class="block px-4 py-2 hover:bg-slate-800 hover:text-orange-400 transition-colors">日本語</a>
                    </div>
                `;
                authButtons.appendChild(langContainer);
            }
        });

        // 검색 기능 함수
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.board-item');
            let count = 0;

            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(keyword)) {
                    item.style.display = '';
                    count++;
                } else {
                    item.style.display = 'none';
                }
            });
            document.getElementById('totalCount').innerText = count;
        }

        // 게시글 삭제 함수
        function deletePost(button) {
            if (confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                const item = button.closest('.board-item');
                item.remove();
                // 전체 개수 갱신
                const currentCount = document.querySelectorAll('.board-item').length;
                document.getElementById('totalCount').innerText = currentCount;
            }
        }
    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'ko', includedLanguages: 'ko,en,zh-CN,ja', autoDisplay: false }, 'google_translate_element');
        }
        function toggleLangMenu(e) {
            e.stopPropagation();
            document.getElementById('langDropdown').classList.toggle('hidden');
        }
        window.addEventListener('click', () => {
            const dropdown = document.getElementById('langDropdown');
            if (dropdown && !dropdown.classList.contains('hidden')) dropdown.classList.add('hidden');
        });
        function changeLanguage(langCode) {
            const selectField = document.querySelector('.goog-te-combo');
            if (selectField) {
                selectField.value = langCode;
                selectField.dispatchEvent(new Event('change'));
                setTimeout(() => { document.documentElement.setAttribute('lang', langCode); }, 300);
            }
        }
        setInterval(() => {
            const htmlTag = document.documentElement;
            const googCookie = document.cookie.split('; ').find(row => row.startsWith('googtrans='));
            if (googCookie) {
                const langVal = googCookie.split('=')[1].split('/')[2];
                if (langVal && htmlTag.getAttribute('lang') !== langVal) htmlTag.setAttribute('lang', langVal);
            }
        }, 1000);
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // 페이지 로드 및 번역 적용 후 화면 표시
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.classList.add('translated');
            }, 300);
        });
    </script>
</body>
</html>
