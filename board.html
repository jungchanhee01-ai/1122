    <script>
        const defaultPosts = [
            { id: 210, title: "팬오션, 2분기 영업이익 57.4% 증가한 1,937억 원 기록", writer: "관리자", date: "2026-08-03", views: 132, content: "탱커부문 영업이익 165.7% 성장…상반기 누적 영업익도 37.4% 늘어\n\n팬오션은 글로벌 불확실성 속에서도 철저한 리스크 관리와 시황 대응을 통해 견조한 실적을 달성했습니다." },
            { id: 209, title: "피격 HMM 나무호 수리 완료…‘출항 계획 수립 중’", writer: "관리자", date: "2026-07-14", views: 151, content: "안전 점검을 모두 마치고 정상 운항을 위한 최종 출항 스케줄을 조율 중입니다." },
            { id: 208, title: "해진공, 해운·항만·물류 AI 전환 선도", writer: "관리자", date: "2026-06-11", views: 248, content: "물류 전 과정에 인공지능(AI) 기술을 접목하여 스마트 항만 생태계를 조성합니다." },
            { id: 207, title: "중동전쟁 중소기업 피해 756건‥물류비 상승·계약 취소", writer: "관리자", date: "2026-05-07", views: 389, content: "지정학적 리스크로 인한 해상 운임 급등과 수출입 기업들의 피해 상황에 대한 대책 마련이 시급합니다." },
            { id: 206, title: "올 인천항 컨 물동량 357만TEU 전망", writer: "관리자", date: "2026-01-22", views: 559, content: "수도권 물류 중심지로서 인천항의 컨테이너 물동량이 꾸준한 증가세를 보이고 있습니다." },
            { id: 205, title: "칭다오 잇는 화물선 매주 수요일 제주 입항", writer: "관리자", date: "2025-10-14", views: 693, content: "한중간 정기 화물선 운항으로 신선식품 및 물류 교류가 더욱 활발해질 전망입니다." },
            { id: 204, title: "대만 완하이라인, 1.3만TEU급 컨선 도입 매듭…남미항로 취항", writer: "관리자", date: "2025-09-02", views: 707, content: "대형 컨테이너선 투입으로 남미 항로의 서비스 경쟁력이 한층 강화되었습니다." },
            { id: 203, title: "\"美 관세 부과 '선주문 효과' 끝\"…아시아 ..", writer: "관리자", date: "2025-08-05", views: 760, content: "미국의 관세 정책 변화에 따른 아시아권 수출입 시장의 동향 변화 분석 리포트입니다." },
            { id: 202, title: "하루에 컨테이너선 단 3척…美 최대 아시아 무역항도 '텅텅'", writer: "관리자", date: "2025-07-02", views: 773, content: "공급망 병목 현상 완화와 물동량 변동에 따른 주요 항만들의 가동 현황입니다." },
            { id: 201, title: "美관세 50% 날벼락에 한국 철강업계 '멘붕'", writer: "`관리자", date: "2025-06-05", views: 759, content: "미국의 급격한 관세 인상 조치로 인해 국내 철강 수출 기업들의 비상 경영이 시작되었습니다." }
        ];

        let posts = JSON.parse(localStorage.getItem('futureGlsPosts'));
        if (!posts) {
            posts = defaultPosts;
            localStorage.setItem('futureGlsPosts', JSON.stringify(posts));
        }

        let currentPostId = null;
        let currentFontSize = "14px"; // 기본 글자 크기

        const editor = document.getElementById('postContentEditor');

        // 브라우저 기본 CSS 스타일 적용 모드 활성화
        document.addEventListener("DOMContentLoaded", () => {
            document.execCommand('styleWithCSS', false, true);
        });

        // 1. 글자 크기 드롭다운 변경 시 처리
        function changeFontSize(selectElem) {
            const size = selectElem.value;
            if (!size) return;
            currentFontSize = size; // 앞으로 입력될 크기 기억

            editor.focus();
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                
                // 드래그해서 선택한 텍스트가 있는 경우: 해당 영역만 크기 변경
                if (!range.collapsed) {
                    const span = document.createElement('span');
                    span.style.fontSize = size;
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                    selection.removeAllRanges();
                } else {
                    // 드래그가 없는 경우: 커서 위치에 스타일이 지정된 빈 span을 삽입하여 이후 타이핑에 반영
                    const span = document.createElement('span');
                    span.style.fontSize = size;
                    span.innerHTML = '&#8203;'; // 제로 너비 공백
                    range.insertNode(span);
                    
                    range.setStart(span, 0);
                    range.setEnd(span, 0);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
            }
        }

        // 2. 글을 입력할 때 현재 설정된 글자 크기로 자동 감싸기 (워드/한글 방식)
        editor.addEventListener('input', (e) => {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            const container = range.commonAncestorContainer;
            
            // 현재 커서가 특정 span(글자크기가 지정된 곳) 안에 있지 않다면 현재 설정된 크기로 감싸기
            let parentSpan = container.nodeType === 3 ? container.parentElement : container;
            if (parentSpan && parentSpan !== editor && !parentSpan.style.fontSize) {
                // 이미 스타일이 없는 일반 텍스트 노드일 경우 크기 적용
                if (container.nodeType === 3 && container.textContent.length === 1) {
                    const span = document.createElement('span');
                    span.style.fontSize = currentFontSize;
                    span.textContent = container.textContent;
                    container.parentNode.replaceChild(span, container);
                    
                    range.setStartAfter(span);
                    range.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
            }
        });

        // 글꼴 변경 함수
        function changeFontFamily(selectElem) {
            const font = selectElem.value;
            if (!font) return;
            editor.focus();
            document.execCommand('fontName', false, font);
            selectElem.value = "";
        }

        // 이미지 삽입 함수
        function insertImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                editor.focus();

                const img = document.createElement('img');
                img.src = base64Image;
                img.style.maxWidth = "100%";
                img.style.borderRadius = "0.75rem";
                img.style.margin = "1rem 0";
                
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.insertNode(img);
                    range.collapse(false);
                } else {
                    editor.appendChild(img);
                }
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        // 테이블 렌더링
        function renderTable(data) {
            const tbody = document.getElementById('boardBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-slate-400">검색된 결과가 없습니다.</td></tr>`;
                return;
            }

            data.forEach(post => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors cursor-pointer";
                tr.onclick = () => viewDetail(post.id);
                tr.innerHTML = `
                    <td class="py-4 px-4 text-slate-400 font-medium">${post.id}</td>
                    <td class="py-4 px-6 text-left font-semibold text-slate-900 hover:text-orange-600">${post.title}</td>
                    <td class="py-4 px-4">${post.writer}</td>
                    <td class="py-4 px-4 text-xs text-slate-500">${post.date}</td>
                    <td class="py-4 px-4 text-xs text-slate-400">${post.views}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 상세 보기 화면 전환
        function viewDetail(id) {
            const post = posts.find(p => p.id === id);
            if(!post) return;

            currentPostId = id;
            post.views += 1;
            localStorage.setItem('futureGlsPosts', JSON.stringify(posts));

            document.getElementById('detailTitle').innerText = post.title;
            document.getElementById('detailWriter').innerText = post.writer;
            document.getElementById('detailDate').innerText = post.date;
            document.getElementById('detailViews').innerText = post.views;
            document.getElementById('detailContent').innerHTML = post.content;

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('pageHeader').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 목록으로 돌아가기
        function showListView() {
            currentPostId = null;
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('pageHeader').style.display = 'flex';
            renderTable(posts);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 게시글 삭제
        function deletePost() {
            if(confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                posts = posts.filter(p => p.id !== currentPostId);
                localStorage.setItem('futureGlsPosts', JSON.stringify(posts));
                alert('게시글이 삭제되었습니다.');
                showListView();
            }
        }

        // 검색 기능
        function searchBoard() {
            const type = document.getElementById('searchType').value;
            const keyword = document.getElementById('searchInput').value.toLowerCase();

            const filtered = posts.filter(post => {
                if(type === 'title') {
                    return post.title.toLowerCase().includes(keyword);
                } else if(type === 'writer') {
                    return post.writer.toLowerCase().includes(keyword);
                }
            });
            renderTable(filtered);
        }

        // 모달 제어
        function openWriteModal() {
            document.getElementById('writeModal').classList.remove('hidden');
        }
        function closeWriteModal() {
            document.getElementById('writeModal').classList.add('hidden');
            document.getElementById('writeForm').reset();
            editor.innerHTML = '';
            document.getElementById('fontSizeSelect').value = "";
            currentFontSize = "14px";
        }

        // 새 글 등록 제출
        function submitPost(event) {
            event.preventDefault();
            const title = document.getElementById('postTitle').value;
            const writer = document.getElementById('postWriter').value;
            const content = editor.innerHTML;
            
            if (!content.trim() || content === '<br>') {
                alert('내용을 입력해주세요.');
                return;
            }

            const today = new Date().toISOString().split('T')[0];

            const newPost = {
                id: posts.length > 0 ? posts[0].id + 1 : 1,
                title: title,
                writer: writer,
                date: today,
                views: 1,
                content: content
            };

            posts.unshift(newPost);
            localStorage.setItem('futureGlsPosts', JSON.stringify(posts));
            renderTable(posts);
            closeWriteModal();
            alert('성공적으로 등록되었습니다.');
        }

        // 초기 로딩
        renderTable(posts);
    </script>
</body>
</html>
